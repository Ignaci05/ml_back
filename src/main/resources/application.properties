spring.application.name=mercaditolibre

# Asignación de puerto dinámico (para Render / Cloud)
server.port=${PORT:8085}

# Conexión a la base de datos (Soporta DATABASE_URL completo o variables individuales DB_HOST, DB_USER, etc.)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mercaditolibre_db}?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:canela-1}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

## Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración global de CORS para React / Frontend
spring.mvc.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Propiedades de seguridad
app.jwt.secret=${JWT_SECRET:006aa498da0c6c4e1977a3d3c5799552fc9123557be9c93bb6c2d740878ccceb}
app.jwt.expiration-ms=86400000

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.currency=mxn
stripe.business.name=Mercadito Libre

# FrontEnd URL
frontend.url=${FRONTEND_URL:http://localhost:3000}




